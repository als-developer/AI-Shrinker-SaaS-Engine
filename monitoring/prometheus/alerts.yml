# Prometheus Alert Rules for Sovereign Grid
# Version: 31.0

groups:
  - name: api_alerts
    interval: 30s
    rules:
      - alert: HighAPILatency
        expr: histogram_quantile(0.95, rate(sovereign_api_request_duration_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
          component: api
        annotations:
          summary: "High API latency detected"
          description: "95th percentile API latency is {{ $value }}s for endpoint {{ $labels.endpoint }}"

      - alert: HighErrorRate
        expr: |
          (sum(rate(sovereign_api_requests_total{status=~"5.."}[5m])) / 
           sum(rate(sovereign_api_requests_total[5m]))) > 0.05
        for: 2m
        labels:
          severity: critical
          component: api
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }}"

      - alert: RateLimitHits
        expr: rate(sovereign_rate_limit_hits_total[5m]) > 10
        for: 10m
        labels:
          severity: warning
          component: rate_limit
        annotations:
          summary: "High rate limit hits"
          description: "Rate limit being hit frequently for tier {{ $labels.tier }}"

  - name: system_alerts
    interval: 30s
    rules:
      - alert: HighCPULoad
        expr: node_cpu_seconds_total{mode="user"} > 0.85
        for: 10m
        labels:
          severity: warning
          component: system
        annotations:
          summary: "High CPU load"
          description: "CPU usage is at {{ $value }}% for node {{ $labels.instance }}"

      - alert: HighMemoryUsage
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes > 0.9
        for: 5m
        labels:
          severity: critical
          component: system
        annotations:
          summary: "High memory usage"
          description: "Memory usage is at {{ $value | humanizePercentage }}"

      - alert: LowDiskSpace
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.1
        for: 5m
        labels:
          severity: critical
          component: storage
        annotations:
          summary: "Low disk space"
          description: "Only {{ $value | humanizePercentage }} disk space remaining"

  - name: business_alerts
    interval: 1m
    rules:
      - alert: ZeroTransactions
        expr: rate(sovereign_transactions_total[1h]) == 0
        for: 1h
        labels:
          severity: warning
          component: business
        annotations:
          summary: "No transactions processed"
          description: "No transactions have been processed in the last hour"

      - alert: SLAViolation
        expr: increase(sovereign_sla_violations_total[1h]) > 0
        for: 0m
        labels:
          severity: critical
          component: sla
        annotations:
          summary: "SLA violation detected"
          description: "SLA violation for {{ $labels.org_tier }}: {{ $labels.violation_type }}"

  - name: queue_alerts
    interval: 30s
    rules:
      - alert: QueueBacklog
        expr: sovereign_queue_size > 5000
        for: 10m
        labels:
          severity: warning
          component: queue
        annotations:
          summary: "Queue backlog detected"
          description: "Queue {{ $labels.queue_name }} has {{ $value }} pending items"

      - alert: DatabaseConnectionPoolExhaustion
        expr: sovereign_database_connections > 0.9 * sovereign_database_connections_max
        for: 5m
        labels:
          severity: critical
          component: database
        annotations:
          summary: "Database connection pool nearing limit"
          description: "Connection pool {{ $labels.pool }} at {{ $value }} connections"

  - name: cache_alerts
    interval: 1m
    rules:
      - alert: LowCacheHitRate
        expr: |
          sum(rate(sovereign_cache_hits_total[5m])) / 
          (sum(rate(sovereign_cache_hits_total[5m])) + sum(rate(sovereign_cache_misses_total[5m]))) < 0.7
        for: 15m
        labels:
          severity: warning
          component: cache
        annotations:
          summary: "Low cache hit rate"
          description: "Cache hit rate is {{ $value | humanizePercentage }}"
