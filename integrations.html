<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Integrations | Sovereign Grid</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100">

    <div class="max-w-5xl mx-auto p-8">
        <h1 class="text-2xl font-bold mb-6">Integrations</h1>

        <div class="grid md:grid-cols-2 gap-6">
            <!-- Slack Integration -->
            <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6">
                <div class="flex items-center gap-4 mb-4"><span class="text-3xl">💬</span><div><h3 class="font-bold">Slack</h3><p class="text-xs text-gray-400">Receive alerts and notifications in Slack</p></div></div>
                <button class="w-full py-2 border border-gray-700 rounded-lg text-sm">Connect Slack</button>
            </div>

            <!-- Discord Integration -->
            <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6">
                <div class="flex items-center gap-4 mb-4"><span class="text-3xl">🎮</span><div><h3 class="font-bold">Discord</h3><p class="text-xs text-gray-400">Send webhook events to Discord channels</p></div></div>
                <button class="w-full py-2 border border-gray-700 rounded-lg text-sm">Connect Discord</button>
            </div>

            <!-- Datadog Integration -->
            <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6">
                <div class="flex items-center gap-4 mb-4"><span class="text-3xl">📊</span><div><h3 class="font-bold">Datadog</h3><p class="text-xs text-gray-400">Export metrics to Datadog for monitoring</p></div></div>
                <button class="w-full py-2 border border-gray-700 rounded-lg text-sm">Configure</button>
            </div>

            <!-- PagerDuty Integration -->
            <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6">
                <div class="flex items-center gap-4 mb-4"><span class="text-3xl">🚨</span><div><h3 class="font-bold">PagerDuty</h3><p class="text-xs text-gray-400">Critical alerts for on-call engineers</p></div></div>
                <button class="w-full py-2 border border-gray-700 rounded-lg text-sm">Configure</button>
            </div>
        </div>
    </div>
</body>
</html>
