<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Sovereign Grid</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex items-center justify-center">

    <div class="max-w-md w-full mx-4">
        <div class="text-center mb-8">
            <span class="text-4xl">🔐</span>
            <h1 class="text-2xl font-bold mt-2">Reset Password</h1>
            <p class="text-gray-500 text-sm mt-1">We'll send you a link to reset your password</p>
        </div>

        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-8">
            <form id="resetForm">
                <div class="mb-6">
                    <label class="block text-sm font-medium mb-2">Email Address</label>
                    <input type="email" id="email" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-indigo-500" placeholder="developer@company.com">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 py-3 rounded-xl font-semibold transition">Send Reset Link</button>
            </form>

            <div class="mt-6 text-center">
                <a href="/login" class="text-sm text-indigo-400 hover:text-indigo-300">Back to Sign In</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            alert(`Password reset link sent to ${email}`);
            window.location.href = '/login';
        });
    </script>
</body>
</html>
