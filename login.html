<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Sovereign Grid</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex items-center justify-center">

    <div class="max-w-md w-full mx-4">
        <div class="text-center mb-8">
            <span class="text-4xl">⚡</span>
            <h1 class="text-2xl font-bold mt-2 bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">Sovereign Grid</h1>
            <p class="text-gray-500 text-sm mt-1">Sign in to your account</p>
        </div>

        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-8">
            <form id="loginForm">
                <div class="mb-4">
                    <label class="block text-sm font-medium mb-2">Email Address</label>
                    <input type="email" id="email" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-indigo-500" placeholder="developer@company.com">
                </div>
                <div class="mb-6">
                    <label class="block text-sm font-medium mb-2">Password</label>
                    <input type="password" id="password" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-indigo-500" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 py-3 rounded-xl font-semibold transition">Sign In</button>
            </form>

            <div class="mt-6 text-center">
                <a href="/register" class="text-sm text-indigo-400 hover:text-indigo-300">Don't have an account? Sign up</a>
            </div>

            <div class="mt-6 pt-6 border-t border-gray-800">
                <button onclick="loginWithSupabase()" class="w-full bg-gray-800 hover:bg-gray-700 py-3 rounded-xl font-semibold transition flex items-center justify-center gap-2">
                    <span>🔐</span> Continue with Supabase
                </button>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // In production, call Supabase auth endpoint
            console.log('Login attempt:', email);
            alert('Login successful! Redirecting to dashboard...');
            window.location.href = '/dashboard';
        });

        function loginWithSupabase() {
            // Redirect to Supabase OAuth
            window.location.href = 'https://your-project.supabase.co/auth/v1/authorize?provider=google';
        }
    </script>
</body>
</html>
