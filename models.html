<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Library | AI Shrinker</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100">

    <div class="max-w-7xl mx-auto p-8">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-2xl font-bold">AI Model Library</h1>
            <button class="px-4 py-2 bg-indigo-600 rounded-lg text-sm">+ Import Custom Model</button>
        </div>

        <!-- Search -->
        <input type="text" placeholder="Search models..." class="w-full bg-gray-900 border border-gray-800 rounded-xl px-6 py-3 mb-8">

        <!-- Models Grid -->
        <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6 hover:border-indigo-500 transition">
                <div class="flex justify-between items-start">
                    <span class="text-3xl">🦙</span>
                    <span class="px-2 py-1 bg-blue-900 text-blue-400 text-xs rounded">70B</span>
                </div>
                <h3 class="font-bold text-lg mt-2">Meta-Llama-3-70B</h3>
                <p class="text-gray-400 text-sm mt-1">Meta's latest large language model</p>
                <div class="mt-4 flex justify-between text-xs"><span>Original: 140GB</span><span>Compressed: 14GB</span></div>
                <div class="mt-4 flex gap-2"><button class="flex-1 py-2 bg-indigo-600 rounded-lg text-sm">Compress</button><button class="px-3 py-2 border border-gray-700 rounded-lg">Details</button></div>
            </div>

            <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6 hover:border-indigo-500 transition">
                <div class="flex justify-between items-start"><span class="text-3xl">🤖</span><span class="px-2 py-1 bg-blue-900 text-blue-400 text-xs rounded">7B</span></div>
                <h3 class="font-bold text-lg mt-2">Mistral-7B-v0.3</h3>
                <p class="text-gray-400 text-sm mt-1">High-performance 7B parameter model</p>
                <div class="mt-4 flex justify-between text-xs"><span>Original: 14GB</span><span>Compressed: 1.4GB</span></div>
                <div class="mt-4 flex gap-2"><button class="flex-1 py-2 bg-indigo-600 rounded-lg text-sm">Compress</button><button class="px-3 py-2 border border-gray-700 rounded-lg">Details</button></div>
            </div>

            <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6 hover:border-indigo-500 transition">
                <div class="flex justify-between items-start"><span class="text-3xl">🐪</span><span class="px-2 py-1 bg-blue-900 text-blue-400 text-xs rounded">34B</span></div>
                <h3 class="font-bold text-lg mt-2">CodeLlama-34B</h3>
                <p class="text-gray-400 text-sm mt-1">Specialized for code generation</p>
                <div class="mt-4 flex justify-between text-xs"><span>Original: 68GB</span><span>Compressed: 6.8GB</span></div>
                <div class="mt-4 flex gap-2"><button class="flex-1 py-2 bg-indigo-600 rounded-lg text-sm">Compress</button><button class="px-3 py-2 border border-gray-700 rounded-lg">Details</button></div>
            </div>
        </div>
    </div>
</body>
</html>
