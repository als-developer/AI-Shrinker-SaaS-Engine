version: 2
updates:
  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Africa/Dar_es_Salaam"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps"
      include: "scope"
    reviewers:
      - "engineering-team"
    assignees:
      - "devops-lead"
    versioning-strategy: "lockfile-only"
    allow:
      - dependency-type: "all"
    ignore:
      - dependency-name: "fastapi"
        update-types: ["version-update:semver-major"]
    groups:
      fastapi:
        patterns:
          - "fastapi*"
          - "uvicorn*"
      database:
        patterns:
          - "supabase*"
          - "asyncpg*"
          - "sqlalchemy*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"

  # Docker
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "docker"
      include: "scope"
