apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sovereign-ingress
  namespace: sovereign-grid
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-burst: "200"
spec:
  tls:
  - hosts:
    - api.sovereigngrid.com
    - sovereigngrid.com
    secretName: sovereign-tls
  rules:
  - host: api.sovereigngrid.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sovereign-api-service
            port:
              number: 80
  - host: sovereigngrid.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sovereign-frontend-service
            port:
              number: 80
