apiVersion: v1
kind: Namespace
metadata:
  name: sovereign-grid
  labels:
    name: sovereign-grid
    environment: production
    managed-by: k8s
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: sovereign-grid-quota
  namespace: sovereign-grid
spec:
  hard:
    requests.cpu: "20"
    requests.memory: 40Gi
    limits.cpu: "40"
    limits.memory: 80Gi
    persistentvolumeclaims: "10"
    pods: "50"
    services: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: sovereign-grid-limits
  namespace: sovereign-grid
spec:
  limits:
  - default:
      cpu: 500m
      memory: 1Gi
    defaultRequest:
      cpu: 250m
      memory: 512Mi
    type: Container
