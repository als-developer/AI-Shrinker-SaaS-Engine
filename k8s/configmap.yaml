apiVersion: v1
kind: ConfigMap
metadata:
  name: sovereign-config
  namespace: sovereign-grid
data:
  app-config.yaml: |
    environment: production
    log_level: info
    enable_tracing: true
    enable_metrics: true
    
    database:
      pool_size: 20
      max_overflow: 40
      pool_timeout: 30
    
    rate_limits:
      free_tier: 10
      developer_tier: 100
      business_tier: 1000
      enterprise_tier: 5000
    
    features:
      truth_engine: enabled
      centpay: enabled
      ai_shrinker: enabled
      compliance_shield: enabled
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-config
  namespace: sovereign-grid
data:
  envoy.yaml: |
    static_resources:
      listeners:
      - name: listener_0
        address:
          socket_address:
            address: 0.0.0.0
            port_value: 9901
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: ingress_http
              codec_type: AUTO
              route_config:
                name: local_route
                virtual_hosts:
                - name: backend
                  domains: ["*"]
                  routes:
                  - match:
                      prefix: "/"
                    route:
                      cluster: sovereign-api
              http_filters:
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
      - name: sovereign-api
        connect_timeout: 30s
        type: STRICT_DNS
        lb_policy: ROUND_ROBIN
        load_assignment:
          cluster_name: sovereign-api
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: sovereign-api-service
                    port_value: 80
