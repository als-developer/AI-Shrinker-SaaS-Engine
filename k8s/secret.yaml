apiVersion: v1
kind: Secret
metadata:
  name: sovereign-secrets
  namespace: sovereign-grid
type: Opaque
stringData:
  supabase-url: https://your-project.supabase.co
  supabase-key: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9... (your key)
  supabase-jwt-secret: your-jwt-secret-here
  redis-password: your-redis-password
  smtp-password: your-smtp-password
  slack-webhook-url: https://hooks.slack.com/services/...
  solana-private-key: your-solana-private-key
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
  namespace: sovereign-grid
type: Opaque
stringData:
  password: your-redis-password
---
apiVersion: v1
kind: Secret
metadata:
  name: tls-secret
  namespace: sovereign-grid
type: kubernetes.io/tls
stringData:
  tls.crt: |
    -----BEGIN CERTIFICATE-----
    your-tls-certificate
    -----END CERTIFICATE-----
  tls.key: |
    -----BEGIN PRIVATE KEY-----
    your-private-key
    -----END PRIVATE KEY-----
