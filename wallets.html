<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet | Sovereign Grid</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100">

    <div class="max-w-4xl mx-auto p-8">
        <h1 class="text-2xl font-bold mb-6">My Wallet</h1>

        <div class="bg-gradient-to-r from-indigo-900 to-purple-900 rounded-2xl p-8 text-center mb-8">
            <p class="text-gray-300 text-sm">Available Balance</p>
            <p class="text-5xl font-bold mt-2">$247.50</p>
            <p class="text-gray-300 text-sm mt-2">≈ TZS 647,000</p>
            <button class="mt-4 px-6 py-2 bg-white/10 rounded-lg text-sm">Top Up Wallet</button>
        </div>

        <div class="grid md:grid-cols-2 gap-6 mb-8">
            <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6 text-center"><p class="text-gray-400 text-sm">Total Spent (Lifetime)</p><p class="text-2xl font-bold">$1,247.00</p></div>
            <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6 text-center"><p class="text-gray-400 text-sm">Cashback Earned</p><p class="text-2xl font-bold text-green-400">$62.35</p></div>
        </div>

        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6"><h3 class="font-bold mb-4">Recent Transactions</h3>
            <div class="space-y-3"><div class="flex justify-between py-2 border-b border-gray-800"><span>API Usage - May 2026</span><span class="text-red-400">-$49.00</span></div>
            <div class="flex justify-between py-2 border-b border-gray-800"><span>Cashback Reward</span><span class="text-green-400">+$2.45</span></div>
            <div class="flex justify-between py-2"><span>Wallet Top-up</span><span class="text-green-400">+$100.00</span></div></div>
        </div>
    </div>
</body>
</html>
