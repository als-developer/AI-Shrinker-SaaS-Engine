<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Methods | Sovereign Grid</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100">

    <div class="max-w-3xl mx-auto p-8">
        <h1 class="text-2xl font-bold mb-6">Payment Methods</h1>

        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6 mb-6">
            <div class="flex justify-between items-center mb-4"><h3 class="font-bold">Saved Payment Methods</h3><button class="text-indigo-400 text-sm">+ Add New</button></div>
            <div class="flex items-center justify-between p-4 bg-gray-800 rounded-xl">
                <div class="flex items-center gap-3"><span class="text-2xl">💳</span><div><p class="font-medium">VISA •••• 4242</p><p class="text-xs text-gray-400">Expires 12/2028</p></div></div>
                <div><span class="px-2 py-1 bg-green-900 text-green-400 text-xs rounded">Default</span><button class="ml-3 text-gray-500 text-sm">Remove</button></div>
            </div>
        </div>

        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6">
            <h3 class="font-bold mb-4">Add Mobile Money (Africa)</h3>
            <div class="grid grid-cols-2 gap-4">
                <button class="p-3 bg-gray-800 rounded-xl text-center hover:border-indigo-500 border border-gray-700">📱 M-Pesa</button>
                <button class="p-3 bg-gray-800 rounded-xl text-center hover:border-indigo-500 border border-gray-700">📱 Tigo Pesa</button>
                <button class="p-3 bg-gray-800 rounded-xl text-center hover:border-indigo-500 border border-gray-700">📱 Airtel Money</button>
                <button class="p-3 bg-gray-800 rounded-xl text-center hover:border-indigo-500 border border-gray-700">₿ Solana USDC</button>
            </div>
        </div>
    </div>
</body>
</html>
